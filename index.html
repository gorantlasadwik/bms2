<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow 24/7 Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2e;
            --card-border: #232d45;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #0284c7 0%, #6366f1 100%);
            --accent-green: #10b981;
            --accent-red: #f43f5e;
            --accent-yellow: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--accent-primary);
            padding: 0.4rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.25rem;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .stopped-banner {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--accent-green);
            border-radius: 1rem;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
            text-align: center;
            display: none;
        }

        .stopped-banner h3 {
            color: var(--accent-green);
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .stopped-banner p {
            color: var(--text-main);
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }

        .actions-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .status-summary {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .status-title {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .status-time {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--accent-gradient);
            color: #ffffff;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
        }

        .btn-restart {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .cards-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            padding: 1.25rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            transition: border-color 0.2s;
        }

        .card:hover {
            border-color: rgba(56, 189, 248, 0.4);
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .date-badge {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .url-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            word-break: break-all;
        }

        .state-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .state-tag.unavailable {
            background: rgba(244, 63, 94, 0.1);
            color: var(--accent-red);
            border: 1px solid rgba(244, 63, 94, 0.3);
        }

        .state-tag.live {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .open-link {
            color: var(--accent-primary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            margin-top: 0.4rem;
        }

        .open-link:hover {
            text-decoration: underline;
        }

        #toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #1e293b;
            color: #fff;
            border: 1px solid var(--accent-primary);
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            gap: 0.75rem;
            font-weight: 500;
            z-index: 1000;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-badge" id="headerBadge">
                <span class="pulse-dot"></span>
                <span id="headerBadgeText">MONITOR ACTIVE 24/7</span>
            </div>
            <h1>BookMyShow Ticket Tracker</h1>
            <p class="subtitle">Spider-Man INOX The Marina Mall OMR</p>
        </header>

        <div class="stopped-banner" id="stoppedBanner">
            <h3>🎉 TICKETS FOUND & ALERT DISPATCHED!</h3>
            <p id="stoppedReasonText">Tickets are live! Monitoring has stopped automatically to prevent duplicate SMS messages.</p>
            <button class="btn btn-restart" onclick="restartMonitor()">
                <span>🔄</span> Resume Monitoring Service
            </button>
        </div>

        <div class="actions-panel">
            <div class="status-summary">
                <div class="status-title">Monitoring 3 Target Dates</div>
                <div class="status-time" id="lastChecked">Last checked: Just now</div>
            </div>
            <button class="btn" id="sendBtn" onclick="triggerNotification()">
                <span id="btnIcon">⚡</span>
                <span id="btnText">Send Instant Status Alert</span>
            </button>
        </div>

        <div class="cards-grid" id="cardsGrid">
            <!-- Dynamic cards will render here -->
        </div>
    </div>

    <div id="toast">
        <span id="toastIcon">📩</span>
        <span id="toastMsg">Notification sent successfully!</span>
    </div>

    <script>
        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                renderDashboard(data);
            } catch (e) {
                console.error("Failed to fetch status:", e);
            }
        }

        function renderDashboard(data) {
            document.getElementById('lastChecked').innerText = `Last checked: ${data.last_check_time || 'Just now'}`;
            
            const stoppedBanner = document.getElementById('stoppedBanner');
            const headerBadgeText = document.getElementById('headerBadgeText');

            if (data.monitoring_stopped) {
                stoppedBanner.style.display = 'block';
                if (data.stopped_reason) {
                    document.getElementById('stoppedReasonText').innerText = data.stopped_reason;
                }
                headerBadgeText.innerText = 'MONITOR STOPPED (TICKETS FOUND)';
            } else {
                stoppedBanner.style.display = 'none';
                headerBadgeText.innerText = 'MONITOR ACTIVE 24/7';
            }

            const grid = document.getElementById('cardsGrid');
            if (!data.results || data.results.length === 0) {
                grid.innerHTML = '<div class="card"><p style="color: var(--text-muted);">No check results recorded yet. Worker is starting up...</p></div>';
                return;
            }

            grid.innerHTML = data.results.map(item => `
                <div class="card">
                    <div class="card-info">
                        <div class="date-badge">📅 Date: ${item.date_str}</div>
                        <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.2rem;">
                            Status Code: <strong>${item.status_code}</strong> | ${item.reason}
                        </div>
                        <a href="${item.url}" target="_blank" class="open-link">
                            Open BookMyShow Page ↗
                        </a>
                    </div>
                    <div>
                        <span class="state-tag ${item.is_available ? 'live' : 'unavailable'}">
                            ${item.is_available ? '🟢 BOOKINGS LIVE!' : '🔴 NOT OPEN YET'}
                        </span>
                    </div>
                </div>
            `).join('');
        }

        async function triggerNotification() {
            const btn = document.getElementById('sendBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');

            btn.disabled = true;
            btnIcon.className = 'spinner';
            btnIcon.innerText = '';
            btnText.innerText = 'Sending Alert...';

            try {
                const res = await fetch('/api/send-status', { method: 'POST' });
                const data = await res.json();
                showToast(data.message || 'Alert notification dispatched!');
                fetchStatus();
            } catch (e) {
                showToast('Failed to send notification. Check logs.', true);
            } finally {
                btn.disabled = false;
                btnIcon.className = '';
                btnIcon.innerText = '⚡';
                btnText.innerText = 'Send Instant Status Alert';
            }
        }

        async function restartMonitor() {
            try {
                const res = await fetch('/api/restart-monitor', { method: 'POST' });
                const data = await res.json();
                showToast('Monitoring resumed!');
                fetchStatus();
            } catch (e) {
                showToast('Failed to restart monitor.', true);
            }
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = msg;
            toastIcon.innerText = isError ? '⚠️' : '📨';
            toast.style.borderColor = isError ? '#f43f5e' : '#38bdf8';
            toast.style.display = 'flex';

            setTimeout(() => {
                toast.style.display = 'none';
            }, 4000);
        }

        // Fetch on load & auto-refresh every 10s
        fetchStatus();
        setInterval(fetchStatus, 10000);
    </script>
</body>
</html>
